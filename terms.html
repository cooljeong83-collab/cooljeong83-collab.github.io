            padding-left: 0;
            padding-right: 10px;

            border-radius: 6px;
            padding: 15px;
            margin-top: 10px;
            transition: background-color 0.3s, border-color 0.3s;

            margin-bottom: 10px;
        }
        .disclaimer-important {
            color: #D0021B;
            font-weight: bold;
            text-decoration: underline;

            margin: 0 0 15px 0;

            padding-left: 0;
            padding-right: 20px;

            color: #777777;

            border-top: 1px solid #eeeeee;

    function applyLanguage(lang) {
        const selected = i18n[lang] || i18n.en; // 기본 매핑 언어가 없으면 영어(en) 적용

        // HTML 태그 언어 속성 및 정렬 방향(아랍어 처리) 동적 변경
        document.documentElement.lang = lang;
        if (lang === 'ar') {
            document.documentElement.dir = 'rtl';
        } else {
            document.documentElement.dir = 'ltr';
        }

        // DOM 요소에 번역 텍스트 바인딩
        document.getElementById("page-title").textContent = selected.title;
        document.getElementById("main-title").textContent = selected.title;
        
        document.getElementById("sec1-title").textContent = selected.sec1_title;
        document.getElementById("sec1-desc").innerHTML = selected.sec1_desc;
        
        document.getElementById("sec2-title").textContent = selected.sec2_title;
        document.getElementById("sec2-li1").innerHTML = selected.sec2_li1;
        document.getElementById("sec2-li2").innerHTML = selected.sec2_li2;
        document.getElementById("sec2-li3").innerHTML = selected.sec2_li3;
        
        document.getElementById("sec3-title").textContent = selected.sec3_title;
        document.getElementById("sec3-li1").textContent = selected.sec3_li1;
        document.getElementById("sec3-li2").textContent = selected.sec3_li2;
        
        document.getElementById("sec4-title").textContent = selected.sec4_title;
        document.getElementById("sec4-li1").innerHTML = selected.sec4_li1;
        document.getElementById("sec4-li2").innerHTML = selected.sec4_li2;
        document.getElementById("sec4-li3").innerHTML = selected.sec4_li3;
        document.getElementById("sec4-li4").innerHTML = selected.sec4_li4;
        
        document.getElementById("sec5-title").textContent = selected.sec5_title;
        document.getElementById("sec5-desc").textContent = selected.sec5_desc;
        document.getElementById("sec5-li1").textContent = selected.sec5_li1;
        document.getElementById("sec5-li2").textContent = selected.sec5_li2;
        document.getElementById("sec5-li3").textContent = selected.sec5_li3;
        document.getElementById("sec5-li4").textContent = selected.sec5_li4;
        document.getElementById("sec5-li5").textContent = selected.sec5_li5;
        
        document.getElementById("sec6-title").textContent = selected.sec6_title;
        document.getElementById("sec6-li1").textContent = selected.sec6_li1;
        document.getElementById("sec6-li2").textContent = selected.sec6_li2;
        
        document.getElementById("sec7-title").textContent = selected.sec7_title;
        document.getElementById("sec7-li1").textContent = selected.sec7_li1;
        document.getElementById("sec7-li2").textContent = selected.sec7_li2;
        
        document.getElementById("footer-appendix").textContent = selected.appendix;
        document.getElementById("footer-date").textContent = selected.date;
    }

    // 브라우저 언어 감지 로직
    const userLang = navigator.language || navigator.userLanguage; 
    
    // zh-TW, zh-CN 처리를 위해 세밀한 문자열 확인 기법 도입
    let targetLang = 'en';
    const supportedLanguages = ['ko', 'en', 'ja', 'zh', 'zh-TW', 'es', 'ar', 'vi'];
    
    if (userLang.toLowerCase().includes('tw') || userLang.toLowerCase().includes('hk')) {
        targetLang = 'zh-TW';
    } else {
        const shortLang = userLang.substring(0, 2);
        if (supportedLanguages.includes(shortLang)) {
            targetLang = shortLang;
        }
    }
    
    applyLanguage(targetLang);
</script>
