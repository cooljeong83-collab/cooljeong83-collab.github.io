<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ginit - 계정 및 데이터 삭제 요청</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-gray-50 flex flex-col justify-center items-center p-4 font-sans">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-extrabold text-indigo-900 tracking-tight">지닛 <span class="text-indigo-600">Ginit</span></h1>
            <p class="text-gray-500 mt-2 text-sm">계정 및 사용자 데이터 삭제 요청 (Account Deletion Request)</p>
        </div>

        <div id="form-container">
            <div class="bg-red-50 text-red-700 text-xs p-4 rounded-xl mb-6 leading-relaxed">
                ⚠️ <strong>주의사항 (Notice):</strong><br />
                계정 탈퇴 및 데이터 삭제 신청 시, 지닛(Ginit)에 저장된 이메일, 생년월일, 국적, 성별을 포함한 모든 개인 정보가 즉시 영구 삭제되며 복구할 수 없습니다.
            </div>

            <form id="delete-form" class="space-y-4" onsubmit="handleSubmit(event)">
                <div>
                    <label class="block text-gray-700 text-sm font-medium mb-1">지닛 가입 이메일 주소 (Registered Email)</label>
                    <input type="email" id="email" required placeholder="example@gmail.com" class="w-full px-4 py-3 rounded-xl border border-gray-200 text-gray-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm transition">
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-medium mb-1">삭제 사유 (Reason - Optional)</label>
                    <textarea rows="3" placeholder="의견을 남겨주세요." class="w-full px-4 py-3 rounded-xl border border-gray-200 text-gray-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm transition resize-none"></textarea>
                </div>
                <button type="submit" class="w-full bg-red-500 hover:bg-red-600 text-white font-semibold py-3 px-4 rounded-xl transition text-sm shadow-sm">
                    계정 및 데이터 삭제 신청하기 (Submit Request)
                </button>
            </form>
        </div>

        <div id="result-container" class="hidden text-center py-8">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-green-100 text-green-600 text-2xl mb-4">✓</div>
            <h2 class="text-xl font-bold text-gray-900">삭제 요청 완료</h2>
            <p class="text-gray-500 text-sm mt-2 leading-relaxed">
                계정 및 연동 데이터 삭제 접수가 완료되었습니다. 영업일 기준 7일 이내에 모든 데이터가 안전하게 파기됩니다.
            </p>
        </div>

        <div class="mt-8 pt-6 border-t border-gray-100 text-center text-xs text-gray-400">
            문의 및 지원: <a href="mailto:ginit.official@ginit.com" class="underline hover:text-gray-600">내 개발자 이메일 주소</a>
        </div>
    </div>

    <script>
        function handleSubmit(event) {
            event.preventDefault();
            document.getElementById('form-container').classList.add('hidden');
            document.getElementById('result-container').classList.remove('hidden');
        }
    </script>
</body>
</html>
